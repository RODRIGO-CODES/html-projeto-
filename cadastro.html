<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhe Conosco - Irmãos Cell</title>
</head>
<body>
    <header>
        <h1>Trabalhe Conosco</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Serviços</a></li>
                <li><a href="cadastro.html">Trabalhe Conosco</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cadastro de Candidato</h2>
            <p>Preencha o formulário abaixo para se candidatar a uma vaga na <strong>Irmãos Cell</strong>.</p>

            <form action="#" method="post">
                <fieldset>
                    <legend>Informações Pessoais</legend>

                    <label for="nome">Nome Completo:</label><br>
                    <input type="text" id="nome" name="nome" required><br><br>

                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required><br><br>

                    <label for="cpf">CPF:</label><br>
                    <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" required><br><br>

                    <label for="telefone">Telefone:</label><br>
                    <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\)\s?\d{4,5}-\d{4}" placeholder="(11) 99999-9999" required><br><br>

                    <label for="nascimento">Data de Nascimento:</label><br>
                    <input type="date" id="nascimento" name="nascimento" required><br><br>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <label for="endereco">Endereço:</label><br>
                    <input type="text" id="endereco" name="endereco" required><br><br>

                    <label for="cep">CEP:</label><br>
                    <input type="text" id="cep" name="cep" pattern="\d{5}-\d{3}" placeholder="00000-000" required><br><br>

                    <label for="cidade">Cidade:</label><br>
                    <input type="text" id="cidade" name="cidade" required><br><br>

                    <label for="estado">Estado:</label><br>
                    <input type="text" id="estado" name="estado" maxlength="2" placeholder="SP" required><br><br>
                </fieldset>

                <fieldset>
                    <legend>Informações Profissionais</legend>

                    <label for="cargo">Cargo de Interesse:</label><br>
                    <input type="text" id="cargo" name="cargo" placeholder="Ex: Técnico em celulares" required><br><br>

                    <label for="experiencia">Experiência:</label><br>
                    <textarea id="experiencia" name="experiencia" rows="4" cols="40" placeholder="Descreva sua experiência..." required></textarea><br><br>
                </fieldset>

                <input type="submit" value="Enviar Cadastro">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Irmãos Cell</p>
    </footer>
</body>
</html>
